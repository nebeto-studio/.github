name: Bug Report
description: Report a reproducible bug or regression
labels: ["bug", "triage"]
body:
  - type: textarea
    id: summary
    attributes:
      label: Description
      description: Clear and concise summary of the bug.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to Reproduce
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected vs Actual Behavior
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Environment / Version
      placeholder: Commit SHA, tag, OS, runtime version
